<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taller 5: Calculadora con selector</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <a href="../index.html">&larr; Volver al inicio</a>
        <h1>Taller 5: Calculadora con selector</h1>
        <p>Desarrolla una calculadora que una los cuatro ejercicios guiados: el usuario escribe dos números y elige la operación en un selector.</p>
    </header>

    <main>
        <form id="formTaller5" novalidate>
            <label for="primero">Número 1:</label>
            <input type="number" id="primero" step="any">

            <label for="segundo">Número 2:</label>
            <input type="number" id="segundo" step="any">

            <label for="operacion">Operación:</label>
            <select id="operacion">
                <option value="">Selecciona una operación</option>
                <option id="suma" value="suma">Suma (+)</option>
                <option id="resta" value="resta">Resta (−)</option>
                <option id="multiplicacion" value="multiplicacion">Multiplicación (×)</option>
                <option id="division" value="division">División (÷)</option>
            </select>

            <div class="botones">
                <input type="submit" value="Verificar">
                <input type="reset" value="Limpiar">
            </div>
        </form>

        <!-- Aquí se mostrarán los mensajes de error y el resultado -->
        <p id="resultado" class="mensaje"></p>
    </main>

    <script src="../js/talleres/taller5.js"></script>
</body>
</html>
